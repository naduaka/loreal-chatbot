<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Oréal AI Routine Builder</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

<header>

    <img src="loreal-logo.png" class="logo" alt="L'Oréal">

    <h1>L'Oréal Routine Builder</h1>

    <p>Create your personalized skincare routine powered by AI.</p>

</header>

<main>

<section class="controls">

<input
type="text"
id="searchInput"
placeholder="Search products...">

<select id="categoryFilter">

<option value="all">All Categories</option>

<option value="cleanser">Cleanser</option>

<option value="serum">Serum</option>

<option value="moisturizer">Moisturizer</option>

<option value="sunscreen">Sunscreen</option>

<option value="treatment">Treatment</option>

<option value="makeup">Makeup</option>

<option value="haircare">Haircare</option>

<option value="fragrance">Fragrance</option>

</select>

<button id="rtlToggle">
🌍 RTL
</button>

</section>

<section id="productGrid" class="product-grid">

<!-- Products load here -->

</section>

<section class="selected-section">

<div class="selected-header">

<h2>Selected Products</h2>

<button id="clearSelections">

Clear All

</button>

</div>

<div id="selectedProducts">

<p>No products selected.</p>

</div>

<button id="generateRoutine">

✨ Generate Routine

</button>

</section>

<section class="chat-container">

<h2>About Your Routine</h2>

<div id="chatMessages" class="chat-messages">

<div class="bot-message">

Hi! Select some L'Oréal products and I'll build a personalized routine.

</div>

</div>

<div class="chat-input">

<input

id="userInput"

type="text"

placeholder="Ask about your routine...">

<button id="sendButton">

Send

</button>

</div>

</section>

</main>

<footer>

<a href="#">Privacy Policy</a>

<a href="#">Terms of Use</a>

<a href="#">Contact</a>

</footer>

<script src="script.js"></script>

</body>
</html>
